services:
  vision-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vision}
    volumes:
    - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  vision-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
    - '4000'
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '4000'
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      PORT: '4000'
      DATABASE_URL: postgres://postgres:postgres@vision-db:5432/vision?sslmode=disable
      DOMAIN: ${DOMAIN:-http://localhost:3000}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      SSO_ONLY: ${SSO_ONLY:-false}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
    depends_on:
      vision-db:
        condition: service_healthy
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  vision-client:
    restart: unless-stopped
    build:
      context: apps/client
      dockerfile: Dockerfile
    expose:
    - '3000'
    environment:
      API_URL: http://vision-api:4000
    depends_on:
    - vision-api
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
volumes:
  db_data:
    name: vision_db_data
