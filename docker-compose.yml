services:
  vision-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vision}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  vision-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
    expose:
      - "4000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@vision-db:5432/vision?sslmode=disable
      DOMAIN: ${DOMAIN:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      SSO_ONLY: ${SSO_ONLY:-false}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
    depends_on:
      vision-db:
        condition: service_healthy

  vision-client:
    restart: unless-stopped
    build:
      context: apps/client
      dockerfile: Dockerfile
      network: host
    expose:
      - "3000"
    environment:
      API_URL: http://vision-api:4000
    depends_on:
      - vision-api

volumes:
  db_data:
    name: vision_db_data
