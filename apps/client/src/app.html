<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Vision" />
		<meta property="og:url" content="https://vision.facile.studio/" />
		<meta property="og:title" content="Vision — Privacy-friendly analytics" />
		<meta
			property="og:description"
			content="Self-hosted, cookie-free web analytics. Drop a 3.7 KB script on a site and watch pageviews, visitors, referrers and goals in a dashboard you own."
		/>
		<meta property="og:image" content="https://vision.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Vision — Privacy-friendly analytics" />
		<meta
			name="twitter:description"
			content="Self-hosted, cookie-free web analytics. Drop a 3.7 KB script on a site and watch pageviews, visitors, referrers and goals in a dashboard you own."
		/>
		<meta name="twitter:image" content="https://vision.facile.studio/og-image.png" />
		%sveltekit.head%

		<title>Vision — Privacy-friendly analytics</title>
		<meta
			name="description"
			content="Self-hosted, cookie-free web analytics. Drop a 3.7 KB script on a site and watch pageviews, visitors, referrers and goals in a dashboard you own."
		/>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
